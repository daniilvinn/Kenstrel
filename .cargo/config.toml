# ks.exe is a single static executable. Statically link the MSVC CRT so it does
# not need the VC++ redistributable (no vcruntime140.dll / api-ms-win-crt-* imports).
# NOTE: the RUSTFLAGS environment variable replaces this setting entirely; set
# "-C target-feature=+crt-static" there too (see .github/workflows/ci.yml).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
