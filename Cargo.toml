[workspace]
resolver = "2"
members = [
    "crates/ks-core",
    "crates/ks-fs",
    "crates/ks-search",
    "crates/ks-preview",
    "crates/ks-ui",
    "crates/ks-app",
    "crates/ks-claude",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
ks-core = { path = "crates/ks-core" }
ks-fs = { path = "crates/ks-fs" }
ks-search = { path = "crates/ks-search" }
ks-ui = { path = "crates/ks-ui" }
ks-claude = { path = "crates/ks-claude" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
dunce = "1.0.5"
futures-util = "0.3.34"
insta = "1.49.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-width = "0.2.2"
windows = "0.62.2"
