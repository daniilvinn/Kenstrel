# Paper: light theme. Accent is a deeper terracotta for contrast on white.

[colors]
bg = "reset"
fg = "#2b2724"
fg_dim = "#6b645d"
fg_muted = "#958e86"
accent = "#c4623f"
accent_fg = "#fffaf5"
selection_bg = "#ece5dc"
border = "#d4ccc2"
border_focus = "#c4623f"
dir = "#2f6690"
exec = "#3d7a3a"
symlink = "#7a4fa3"
hidden = "#a39c94"
success = "#3d7a3a"
warning = "#a86f12"
error = "#b8333f"
git_added = "#3d7a3a"
git_modified = "#a86f12"
git_untracked = "#8a6a3f"
git_ignored = "#a39c94"
git_conflict = "#b8333f"
match = "#b4472a"

# Syntax highlighting for the preview pane (see ember.toml for the defaults).
[syntax]
keyword = "#b04a2a"
string = "#3f7a2e"
comment = "#8a847a"
function = "#1f5f99"
type = "#9a6a10"
number = "#8a3fa8"
constant = "#a05a1a"
operator = "#555048"
punctuation = "#6f6a60"
