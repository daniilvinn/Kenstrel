# Ember: dark theme with a warm terracotta accent.
# `bg = "reset"` keeps the terminal's own background (Windows Terminal theme, transparency).

[colors]
bg = "reset"
fg = "#e8e3dc"
fg_dim = "#a9a29a"
fg_muted = "#716b64"
accent = "#d97757"
accent_fg = "#1f1b18"
selection_bg = "#2f2a26"
border = "#403a35"
border_focus = "#8f5c47"
dir = "#7fa8c9"
exec = "#92c07f"
symlink = "#b799d9"
hidden = "#625c56"
success = "#92c07f"
warning = "#e5b567"
error = "#e8707a"
git_added = "#92c07f"
git_modified = "#e5b567"
git_untracked = "#c9a27f"
git_ignored = "#625c56"
git_conflict = "#e8707a"
match = "#f4a582"

# Syntax highlighting for the preview pane. Every key is optional; unset keys are derived
# from the tokens above (keyword=accent, string=success, comment=fg_muted, function=dir,
# type=warning, number=symlink, constant=git_untracked, operator/punctuation=fg_dim).
[syntax]
keyword = "#d97757"
string = "#9cc27a"
comment = "#7a746c"
function = "#7ab0d8"
type = "#e5c07b"
number = "#c68fd9"
constant = "#d19a66"
operator = "#b8b0a4"
punctuation = "#9a948a"
