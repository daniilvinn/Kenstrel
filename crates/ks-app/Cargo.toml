[package]
name = "ks-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Kestrel, a keyboard-first terminal file explorer for Windows (the ks binary)"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
name = "ks_app"
path = "src/lib.rs"

[[bin]]
name = "ks"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ks-core.workspace = true
ks-fs.workspace = true
ks-search.workspace = true
ks-ui.workspace = true
ks-claude.workspace = true
anyhow.workspace = true
base64 = "0.22.1"
clap.workspace = true
crossterm.workspace = true
directories.workspace = true
dunce.workspace = true
futures-util.workspace = true
ratatui.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ks-preview = { version = "0.1.0", path = "../ks-preview" }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.152"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
trash = "5.2.9"
