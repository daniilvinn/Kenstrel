[package]
name = "ks-claude"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Kestrel engine for embedding the user's own Claude Code CLI"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
interprocess = { version = "2.4.5", features = ["tokio"] }
portable-pty = "0.9.0"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.2.2"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.152"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "process"] }
tokio-util.workspace = true
tracing.workspace = true
uuid = { version = "1.28.0", features = ["v4"] }
vt100 = "0.16.2"
which = "8.0.6"

[dev-dependencies]
tempfile.workspace = true
