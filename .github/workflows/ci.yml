name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # RUSTFLAGS replaces .cargo/config.toml rustflags, so the static CRT is repeated here.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (clipboard needs X11/xcb headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --no-fail-fast
        # A hung test must fail the step, not eat the whole job budget.
        timeout-minutes: 20
        env:
          INSTA_UPDATE: "no"
          RUST_BACKTRACE: "1"
      - name: Keypress latency budget (release build, p99 under 16 ms)
        if: runner.os == 'Windows'
        run: cargo test --release -p ks-ui keypress_to_frame_stays_within_budget -- --nocapture
        env:
          INSTA_UPDATE: "no"
      - name: Release build
        run: cargo build --release -p ks-app --locked
      - name: Release exe has no C runtime DLL imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("target/release/ks.exe"))
          $bad = [regex]::Matches($text, '(?i)(vcruntime\w*|msvcp\w*|ucrtbase|api-ms-win-crt-[a-z0-9-]+)\.dll') | ForEach-Object { $_.Value } | Sort-Object -Unique
          if ($bad) { Write-Error "dynamic CRT imports: $bad"; exit 1 }
      - name: Upload binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ks-windows-x86_64
          path: target/release/ks.exe
          if-no-files-found: error
      - name: Upload binary (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ks-linux-x86_64
          path: target/release/ks
          if-no-files-found: error
